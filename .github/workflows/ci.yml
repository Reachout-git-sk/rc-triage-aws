name: CI

# Runs on every pull request, and is called by the CD workflow before any deploy.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password # throwaway database inside the CI runner
          POSTGRES_DB: triage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/triage_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  docker:
    name: docker build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg APP_VERSION=${{ github.sha }} -t rc-triage-api:ci .
      - name: smoke test the image
        run: |
          docker run --rm rc-triage-api:ci python -c "import api.app, migrations.migrate, fake_gpu_metrics.server; print('imports ok')"
          docker run --rm rc-triage-api:ci gunicorn --check-config -c gunicorn.conf.py "api.app:create_app()"
